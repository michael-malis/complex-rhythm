name: Preset diversity audit (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - app.js
      - math-io.js
      - tests/preset-diversity.mjs
      - GENRE_IMPLEMENTATION_MATRIX.md
      - RHYTHM_RESEARCH.md
      - PRESET_INVENTORY.json
      - scripts/verify-genre-mapping.mjs
      - .github/workflows/preset-diversity.yml
  push:
    branches: [main]
    paths:
      - app.js
      - math-io.js
      - tests/preset-diversity.mjs
      - GENRE_IMPLEMENTATION_MATRIX.md
      - RHYTHM_RESEARCH.md
      - PRESET_INVENTORY.json
      - scripts/verify-genre-mapping.mjs
      - .github/workflows/preset-diversity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 15 genre-to-preset source mappings
        run: node scripts/verify-genre-mapping.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate and verify mathematical diversity without committing to main
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-diversity.log 2>&1 &
          node tests/preset-diversity.mjs
      - name: Preserve report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preset-diversity-report
          path: |
            PRESET_DIVERSITY_REPORT.md
            PRESET_INVENTORY.md
            PRESET_INVENTORY.json
          if-no-files-found: ignore
