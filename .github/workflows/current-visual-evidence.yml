name: Current visual reference and product guarantees
on:
  pull_request:
    branches: [main]
    paths:
      - TASKS.md
      - PRODUCT_GUARANTEES.md
      - README.md
      - scripts/**
      - tests/spec-baseline.mjs
      - .github/workflows/current-visual-evidence.yml
  push:
    branches: [main]
    paths:
      - TASKS.md
      - PRODUCT_GUARANTEES.md
      - README.md
      - scripts/**
      - tests/spec-baseline.mjs
      - .github/workflows/current-visual-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate outcome backlog and product guarantees
        run: node scripts/verify-backlog.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Measure current responsive appearance (not historical sign-off)
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-visual-evidence.log 2>&1 &
          node tests/spec-baseline.mjs
      - name: Upload real viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roots-rhythm-current-viewport-evidence
          path: qa/baseline/evidence/
          if-no-files-found: ignore
