name: Verify requirement evidence consistency (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - TASKS.md
      - TRACEABILITY.md
      - ACCEPTANCE_CRITERIA.md
      - LEDGER_EVIDENCE_SUMMARY.json
      - MASTER_IMPLEMENTATION_SPEC.md
      - CHANGE_REGISTER.md
      - NEXT_EXECUTION_PLAN.md
      - scripts/**
      - .github/workflows/reconcile-ledger.yml
  push:
    branches: [main]
    paths:
      - TASKS.md
      - TRACEABILITY.md
      - ACCEPTANCE_CRITERIA.md
      - LEDGER_EVIDENCE_SUMMARY.json
      - MASTER_IMPLEMENTATION_SPEC.md
      - CHANGE_REGISTER.md
      - NEXT_EXECUTION_PLAN.md
      - scripts/**
      - .github/workflows/reconcile-ledger.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check three-way requirement registry
        run: node scripts/verify-traceability.mjs
      - name: Check active task coverage without changing historic states
        run: node scripts/verify-execution-plan.mjs
      - name: Verify summary counts agree with source ledger
        run: node scripts/verify-ledger-summary.mjs
