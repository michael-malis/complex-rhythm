name: Rhythm Studio UI regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - math-io.js
      - synthesis.js
      - tests/math-io.test.mjs
      - tests/spec-ui.mjs
      - tests/audio-offline.mjs
      - tests/audio-mix-stress.mjs
      - tests/transport-switching.mjs
      - tests/transport-race.mjs
      - tests/event-properties.mjs
      - tests/collision-lanes.mjs
      - tests/expression-safety.mjs
      - tests/four-lane-polar.mjs
      - tests/canonical-argument.mjs
      - tests/live-edit-reschedule.mjs
      - tests/preset-modified.mjs
      - tests/preset-category-navigation.mjs
      - tests/unified-rhythm-import.mjs
      - tests/single-reschedule-per-edit.mjs
      - tests/all-presets-same-semantics.mjs
      - tests/angle-first.mjs
      - tests/required-polyrhythms.mjs
      - tests/new-preset-live-qa.mjs
      - tests/formula-acceptance.mjs
      - tests/legacy-json-compat.mjs
      - tests/accessibility-contrast.mjs
      - tests/touch-targets.mjs
      - tests/geometry-acceptance.mjs
      - tests/geometry-collision-audit.mjs
      - tests/beat-visual-acceptance.mjs
      - vendor/katex/**
      - styles.css
      - tests/ui-smoke.mjs
      - NEXT_EXECUTION_PLAN.md
      - scripts/verify-execution-plan.mjs
      - .github/workflows/ui-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and testing library
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate consolidated operational plan and legacy requirement coverage
        if: ${{ !cancelled() }}
        run: node scripts/verify-execution-plan.mjs
      - name: Test pure mathematical utilities
        if: ${{ !cancelled() }}
        run: node tests/math-io.test.mjs
      - name: Test math, layout, presets, transport and JSON
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-http.log 2>&1 &
          node tests/ui-smoke.mjs
      - name: Test minimum font sizes, LaTeX, polar input and zoom
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-spec-http.log 2>&1 &
          node tests/spec-ui.mjs
      - name: Render and analyze every new Web Audio voice
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-audio-http.log 2>&1 &
          node tests/audio-offline.mjs
      - name: Stress-test 50 rhythm schedules and limiter output
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-stress-http.log 2>&1 &
          node tests/audio-mix-stress.mjs
      - name: Inspect actual light and dark WCAG contrast at seven viewports
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-contrast-http.log 2>&1 &
          node tests/accessibility-contrast.mjs
      - name: Measure still-open marker and formula-label collisions (diagnostic only)
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-collision-audit-http.log 2>&1 &
          node tests/geometry-collision-audit.mjs
      - name: Verify actual Canvas root diameters, geometry, viewport and dense zoom
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-geometry-http.log 2>&1 &
          node tests/geometry-acceptance.mjs
      - name: Verify synchronized Canvas beat pulse and reduced-motion feedback
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-beat-pulse-http.log 2>&1 &
          node tests/beat-visual-acceptance.mjs
      - name: Measure mobile 44 by 44 pixel interaction targets
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-touch-http.log 2>&1 &
          node tests/touch-targets.mjs
      - name: Switch 24 presets during active Web Audio playback and verify bus cleanup
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-switch-http.log 2>&1 &
          node tests/transport-switching.mjs
      - name: Verify rapid Play cancellation and balanced Web Audio schedulers
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-transport-race.log 2>&1 &
          node tests/transport-race.mjs
      - name: Import all 35 legacy JSON projects and verify precise root phases
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-legacy-http.log 2>&1 &
          node tests/legacy-json-compat.mjs
      - name: Verify all eight required selectable polyrhythm relations
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-ratio.log 2>&1 &
          node tests/required-polyrhythms.mjs
      - name: Check all mathematical formulas, time geometry and live updates
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-formula.log 2>&1 &
          node tests/formula-acceptance.mjs
      - name: Exercise all 15 new studies under live Web Audio and mathematical phase editing
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-new-studies.log 2>&1 &
          node tests/new-preset-live-qa.mjs
      - name: Verify root-set event provenance across 400 deterministic random configurations
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-properties.log 2>&1 &
          node tests/event-properties.mjs
      - name: Verify separate sound lanes, shared phases, geometry and four mathematical counters
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-collision.log 2>&1 &
          node tests/collision-lanes.mjs
      - name: Verify restricted complex-number grammar, malicious-input rejection and canonical state
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-expression.log 2>&1 &
          node tests/expression-safety.mjs
      - name: Edit all four Cartesian/Polar lanes and verify degree/radian round-trip and zero recovery
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-four-lanes.log 2>&1 &
          node tests/four-lane-polar.mjs
      - name: Verify canonical Cartesian complex state, principal argument and undefined zero angle
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-canonical.log 2>&1 &
          node tests/canonical-argument.mjs
      - name: Enforce exactly one voice-bus invalidation for each live parameter edit
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-single-reschedule.log 2>&1 &
          node tests/single-reschedule-per-edit.mjs
      - name: Verify live n and phase edits invalidate stale sound notes and coalesce rapid changes
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-live-edit.log 2>&1 &
          node tests/live-edit-reschedule.mjs
      - name: Compare explicit selection and JSON event semantics for every catalog preset
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-all-presets-import.log 2>&1 &
          node tests/all-presets-same-semantics.mjs
      - name: Check imported preset sample families and live transport transitions
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-import-audio.log 2>&1 &
          node tests/unified-rhythm-import.mjs
      - name: Preserve audio while browsing categories and explicitly selecting examples
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-preset-navigation.log 2>&1 &
          node tests/preset-category-navigation.mjs
      - name: Verify modified preset identity, reset and JSON source title
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-preset-modified.log 2>&1 &
          node tests/preset-modified.mjs
      - name: Verify synchronized radian/degree angle input, added angles and generated roots
        if: ${{ !cancelled() }}
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/rhythm-angle-first.log 2>&1 &
          node tests/angle-first.mjs
      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhythm-ui-screenshots
          path: artifacts/
          if-no-files-found: ignore
