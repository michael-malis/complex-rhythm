name: Vendor pinned KaTeX assets
on:
  push:
    branches: [upgrade/spec-2026-11-math-audio]
    paths:
      - .github/workflows/vendor-katex.yml
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned package and retain distributable files locally
        run: |
          npm pack katex@0.16.22 --silent
          mkdir -p vendor/katex
          tar -xzf katex-0.16.22.tgz --wildcards 'package/dist/katex.min.js' 'package/dist/katex.min.css' 'package/dist/fonts/*' --strip-components=2 -C vendor/katex
          test -s vendor/katex/katex.min.js
          test -s vendor/katex/katex.min.css
          echo 'VENDORED FILES:'
          find vendor/katex -maxdepth 2 -type f | head -30
          test -d vendor/katex/fonts
          find vendor/katex/fonts -name '*.woff2' | grep -q .
      - name: Commit frozen vendor distribution to upgrade branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/katex
          git commit -m 'Vendor KaTeX 0.16.22 including locally served fonts'
          git push origin HEAD:upgrade/spec-2026-11-math-audio
